<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Intelligence</title>
<style>
  :root{
    --bg:#0e1116; --surface:#171b22; --surface2:#1f242d; --line:#2b313b;
    --ink:#e8eaed; --ink2:#aab3c0; --muted:#6b7684;
    --accent:#6ea8fe; --good:#5fd38d; --warn:#f5c451; --alert:#f27a7a;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 18px; border-bottom:1px solid var(--line); background:var(--surface);
  }
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.on{background:var(--good)}
  .pill{color:var(--ink2); font-size:12px; background:var(--surface2);
        border:1px solid var(--line); border-radius:999px; padding:3px 10px}
  .grow{flex:1}

  main{display:grid; grid-template-columns:minmax(0,2fr) minmax(300px,1fr);
       gap:16px; padding:16px; max-width:1200px; margin:0 auto}
  @media(max-width:820px){main{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line);
        border-radius:var(--radius); overflow:hidden}
  .card h2{font-size:12px; text-transform:uppercase; letter-spacing:.6px;
           color:var(--muted); margin:0; padding:10px 14px; border-bottom:1px solid var(--line)}
  .pad{padding:14px}

  /* video */
  .videowrap{position:relative; background:#000; aspect-ratio:4/3; cursor:crosshair}
  .videowrap img{width:100%; height:100%; object-fit:contain; display:block}
  #zonebox{position:absolute; border:2px solid var(--alert); display:none;
           background:rgba(242,122,122,.12); pointer-events:none}
  .overlay{position:absolute; left:10px; bottom:10px; right:10px;
           background:rgba(0,0,0,.55); border-radius:8px; padding:8px 10px; font-size:13px}
  .overlay .info{color:var(--warn); font-size:11px; margin-bottom:2px}
  .nolive{position:absolute; inset:0; display:flex; align-items:center;
          justify-content:center; color:var(--muted)}

  .counts{display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px}
  .chip{background:var(--surface2); border:1px solid var(--line); border-radius:999px;
        padding:2px 10px; font-size:12px; color:var(--ink2)}
  .chip b{color:var(--ink); font-weight:600}

  /* controls */
  .controls{display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px}
  button{font:inherit; color:var(--ink); background:var(--surface2);
         border:1px solid var(--line); border-radius:8px; padding:7px 12px;
         cursor:pointer; transition:background .12s,border-color .12s}
  button:hover{background:#262c36; border-color:#3a414d}
  button:active{transform:translateY(1px)}
  button.active{border-color:var(--accent); color:var(--accent)}
  button.danger:hover{border-color:var(--alert); color:var(--alert)}

  /* chat */
  .chat{display:flex; flex-direction:column; height:360px}
  .log{flex:1; overflow-y:auto; padding:12px 14px; display:flex;
       flex-direction:column; gap:10px}
  .msg{max-width:88%}
  .msg .who{font-size:11px; color:var(--muted); margin-bottom:2px}
  .msg.q{align-self:flex-end; text-align:right}
  .msg.q .body{background:var(--accent); color:#0e1116}
  .msg.a .body{background:var(--surface2); border:1px solid var(--line)}
  .body{display:inline-block; padding:7px 11px; border-radius:10px; text-align:left}
  .ask{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line)}
  .ask input{flex:1; font:inherit; color:var(--ink); background:var(--bg);
             border:1px solid var(--line); border-radius:8px; padding:8px 11px}
  .ask input:focus{outline:none; border-color:var(--accent)}
  #mic.listening{border-color:var(--alert); color:var(--alert)}
  .meter{height:3px; background:var(--alert); border-radius:2px; margin-top:6px;
         width:0; transition:width .08s}

  /* feed */
  .feed{max-height:300px; overflow-y:auto; padding:6px 0}
  .feed .row{display:flex; gap:10px; padding:5px 14px; font-size:13px; align-items:baseline}
  .feed .t{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; flex:none}
  .feed .row.alert .txt{color:var(--alert); font-weight:500}
  .empty{color:var(--muted); padding:10px 14px; font-style:italic}

  /* memory rows */
  .mrow{display:flex; gap:10px; padding:8px 14px; border-top:1px solid var(--line); align-items:flex-start}
  .mrow:first-child{border-top:none}
  .mrow img{width:64px; height:48px; object-fit:cover; border-radius:6px; flex:none; background:#000; cursor:pointer}
  .mrow .mt{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
  .mrow .k{font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--accent)}
  .mrow.alert .k{color:var(--alert)}

  /* face naming */
  .face{display:flex; gap:8px; align-items:center; margin-bottom:8px}
  .face span{color:var(--warn)}
  .face input{flex:1; font:inherit; color:var(--ink); background:var(--bg);
              border:1px solid var(--line); border-radius:7px; padding:5px 9px}
  .face input:focus{outline:none; border-color:var(--accent)}

  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  /* connection banner */
  #banner{display:none; padding:8px 18px; font-size:13px; text-align:center;
          background:var(--alert); color:#160a0a; font-weight:500}
  #banner.warn{background:var(--warn); color:#1a1405}

  /* status dot states */
  .dot.off{background:var(--muted)} .dot.warn{background:var(--warn)}

  /* toasts */
  #toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column;
          gap:8px; z-index:50; align-items:flex-end}
  .toast{background:var(--surface2); border:1px solid var(--line); color:var(--ink);
         border-radius:9px; padding:9px 14px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.4);
         opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s; max-width:300px}
  .toast.show{opacity:1; transform:none}
  .toast.good{border-color:var(--good)} .toast.alert{border-color:var(--alert)}

  /* smoothed numbers: no transition on text, but fade the scene text swap */
  #scene{transition:opacity .15s}
</style>
</head>
<body>
<header>
  <span class="dot" id="livedot"></span>
  <h1>Visual Intelligence</h1>
  <span class="pill" id="model">—</span>
  <span class="pill" id="yolo">—</span>
  <span class="pill" id="fps">— fps</span>
  <span class="grow"></span>
  <span class="pill" id="diary">diary: —</span>
</header>
<div id="banner"></div>
<div id="toasts"></div>

<main>
  <div class="col">
    <div class="card">
      <div class="videowrap" id="videowrap">
        <img id="video" alt="live video">
        <div id="zonebox"></div>
        <div class="nolive" id="nolive">waiting for camera…</div>
        <div class="overlay">
          <div class="info" id="sceneinfo"></div>
          <div id="scene">Analysing…</div>
        </div>
      </div>
      <div class="counts" id="counts"></div>
      <div class="controls">
        <button id="pause" onclick="act('pause')">Pause</button>
        <button onclick="act('model')">Switch model</button>
        <button id="mic" onclick="act('voice')">🎤 Ask by voice</button>
        <button onclick="act('clear_zone')">Clear zone</button>
        <span class="grow"></span>
        <button class="danger" onclick="act('stop')">Stop</button>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="card chat">
      <h2>Assistant</h2>
      <div class="log" id="chatlog"></div>
      <div class="ask">
        <div style="flex:1">
          <input id="q" placeholder="Ask about the scene…" maxlength="300"
                 onkeydown="if(event.key==='Enter')send()">
          <div class="meter" id="meter"></div>
        </div>
        <button onclick="send()">Ask</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px" id="facescard" hidden>
      <h2>Faces</h2>
      <div class="pad" id="unknownfaces"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Activity</h2>
      <div class="feed" id="feed"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Memory</h2>
      <div class="ask" style="border-top:none">
        <input id="msearch" placeholder="Search the diary…" onkeydown="if(event.key==='Enter')loadMemory()">
        <button onclick="loadMemory()">Search</button>
      </div>
      <div class="feed" id="memory" style="max-height:340px"></div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
$("video").src = "/video";

// Toast: a brief corner notification. kind = "" | "good" | "alert".
function toast(text, kind=""){
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.textContent = text;
  $("toasts").appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(), 200); }, 2200);
}

const ACTION_MSG = {pause:"Paused/resumed", model:"Switching model…", voice:"Listening…",
                    clear_zone:"Restricted zone cleared", stop:"Stopping…"};
async function act(a){
  await fetch("/do", {method:"POST", headers:{"Content-Type":"application/json"},
                      body:JSON.stringify({action:a})});
  if(ACTION_MSG[a]) toast(ACTION_MSG[a]);
}
async function send(){
  const q = $("q").value.trim();
  if(!q) return;
  $("q").value = "";
  await fetch("/ask", {method:"POST", headers:{"Content-Type":"application/json"},
                       body:JSON.stringify({question:q})});
}

// ---- restricted zone: drag on the video, send in camera pixels ----
let drag = null, dragging = false, vsize = [640,480];
const wrap = $("videowrap"), box = $("zonebox");

// Letterbox geometry: the video is object-fit:contain, so it sits centred with bars.
function geom(){
  const r = wrap.getBoundingClientRect();
  const scale = Math.min(r.width/vsize[0], r.height/vsize[1]);
  return {r, scale, ox:(r.width-vsize[0]*scale)/2, oy:(r.height-vsize[1]*scale)/2};
}
function toCam(e){  // mouse event -> camera pixels, clamped to the frame
  const {r, scale, ox, oy} = geom();
  return [Math.max(0, Math.min(vsize[0], (e.clientX-r.left-ox)/scale)),
          Math.max(0, Math.min(vsize[1], (e.clientY-r.top -oy)/scale))];
}
// Draw the box from camera-pixel coords (x1,y1,x2,y2), or hide it when null.
// Single source of truth: poll() calls this with the server's zone, so it always matches
// the video and survives window resize; during a drag we call it with the live rectangle.
function drawZone(z){
  if(!z){ box.style.display="none"; return; }
  const {scale, ox, oy} = geom();
  const [x1,y1,x2,y2] = z;
  box.style.display="block";
  box.style.left   = (Math.min(x1,x2)*scale+ox)+"px";
  box.style.top    = (Math.min(y1,y2)*scale+oy)+"px";
  box.style.width  = (Math.abs(x2-x1)*scale)+"px";
  box.style.height = (Math.abs(y2-y1)*scale)+"px";
}

wrap.addEventListener("mousedown", e=>{ e.preventDefault(); drag = toCam(e); dragging = true; });
window.addEventListener("mousemove", e=>{
  if(!dragging) return;
  const [x,y] = toCam(e);
  drawZone([drag[0], drag[1], x, y]);   // live preview in camera coords
});
window.addEventListener("mouseup", async e=>{
  if(!dragging) return;
  dragging = false;
  const [x,y] = toCam(e), [x0,y0] = drag;
  // Send in camera pixels; a tiny drag (a click) clears the zone, matching the OpenCV window.
  await fetch("/zone", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({x1:x0,y1:y0,x2:x,y2:y})});
  // poll() will redraw from the server's authoritative zone on the next tick.
});
window.addEventListener("resize", ()=>drawZone(lastZone));

// ---- memory browsing ----
async function loadMemory(){
  const q = encodeURIComponent($("msearch").value.trim());
  const rows = await (await fetch("/memory?q=" + q)).json();
  $("memory").innerHTML = rows.length ? rows.map(r=>
    `<div class="mrow ${r.kind==='alert'?'alert':''}">`+
    (r.image ? `<img src="/snap/${encodeURIComponent(r.image)}" onclick="window.open(this.src)">` : "")+
    `<div><div class="mt">${esc(r.time)} · <span class="k">${esc(r.kind)}</span></div>`+
    `<div>${esc(r.text)}</div></div></div>`).join("")
    : `<div class="empty">nothing in the diary${q?" for that search":""}</div>`;
}
loadMemory();

// ---- naming faces ----
async function nameFace(id, input){
  const name = input.value.trim();
  if(!name) return;
  await fetch("/name", {method:"POST", headers:{"Content-Type":"application/json"},
                        body:JSON.stringify({id, name})});
  toast("Learned: " + name, "good");
  loadMemory();  // the new person will start appearing in the diary
}
let shownUnknown = "";

// ---- poll state and render ----
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
let shownHistory = -1, shownEvents = "", shownCounts = "", lastZone = null;

function banner(text, cls){
  const b = $("banner");
  if(!text){ b.style.display="none"; return; }
  b.textContent = text; b.className = cls || ""; b.style.display="block";
}

async function poll(){
  let s;
  try{ s = await (await fetch("/state")).json(); }
  catch{  // server unreachable: it was stopped, or crashed
    $("livedot").className = "dot off";
    banner("Lost connection to the app. Is it still running?", "");
    return;
  }

  vsize = s.size;
  lastZone = s.zone;
  if(!dragging) drawZone(s.zone);   // server zone is authoritative except while dragging

  // Connection / health banner: server down > Ollama down > camera off > clear.
  const ollamaDown = (s.scene_info||"").startsWith("ERROR");
  if(ollamaDown)      banner("The vision model is not reachable. Is Ollama running?", "warn");
  else if(!s.live)    banner("Waiting for the camera…", "warn");
  else                banner("");
  $("livedot").className = "dot" + (ollamaDown ? " warn" : s.live ? " on" : " off");
  $("nolive").style.display = s.live ? "none" : "flex";
  $("model").textContent = s.model;
  $("yolo").textContent = "YOLO: " + s.yolo;
  $("fps").textContent = s.fps + " fps";
  $("diary").textContent = "diary: " + s.diary;
  $("scene").textContent = s.scene || "Analysing…";
  $("sceneinfo").textContent = s.scene_info + (s.paused ? "  · PAUSED" : "");
  $("pause").textContent = s.paused ? "Resume" : "Pause";
  $("pause").classList.toggle("active", s.paused);

  // counts - only rebuild when they change
  const csig = JSON.stringify(s.counts);
  if(csig !== shownCounts){
    shownCounts = csig;
    $("counts").innerHTML = s.counts.length
      ? s.counts.map(([name,n])=>`<span class="chip"><b>${n}</b> ${esc(name)}</span>`).join("")
      : `<span class="chip">nothing in view</span>`;
  }

  // voice
  const mic = $("mic");
  mic.classList.toggle("listening", s.listening);
  mic.textContent = s.listening ? (s.stage==="listening" ? "🔴 Listening…" : "…thinking") : "🎤 Ask by voice";
  $("meter").style.width = (s.listening ? Math.min(100, s.level*300) : 0) + "%";

  // chat: only rebuild when history or pending changes
  const sig = s.history.length + "|" + (s.pending||"");
  if(sig !== shownHistory){
    shownHistory = sig;
    let html = s.history.map(([q,a])=>
      `<div class="msg q"><div class="who">you</div><div class="body">${esc(q)}</div></div>`+
      `<div class="msg a"><div class="who">assistant</div><div class="body">${esc(a)}</div></div>`
    ).join("");
    if(s.pending)
      html += `<div class="msg q"><div class="who">you</div><div class="body">${esc(s.pending)}</div></div>`+
              `<div class="msg a"><div class="who">assistant</div><div class="body">…</div></div>`;
    const log = $("chatlog"); log.innerHTML = html; log.scrollTop = log.scrollHeight;
  }

  // faces: offer to name the unknown ones (only rebuild when the set changes)
  $("facescard").hidden = !s.faces_on;
  if(s.faces_on){
    const sig = (s.unknown||[]).join(",");
    if(sig !== shownUnknown){
      shownUnknown = sig;
      const u = s.unknown || [];
      $("unknownfaces").innerHTML = u.length
        ? u.map(id=>`<div class="face"><span>${esc(id)}</span>`+
            `<input placeholder="name this person" onkeydown="if(event.key==='Enter')nameFace('${esc(id)}',this)">`+
            `</div>`).join("")
        : `<div class="empty" style="padding:0">everyone in view is known</div>`;
    }
  }

  // activity feed (newest first) - only rebuild when the events changed
  const esig = s.events.length + "|" + (s.events.length ? s.events[s.events.length-1][0] : "");
  if(esig !== shownEvents){
    // Toast any new alert so it isn't missed (skip the very first poll, which loads history).
    if(shownEvents !== "" && s.events.length){
      const [, txt, alert] = s.events[s.events.length-1];
      if(alert) toast("⚠ " + txt, "alert");
    }
    shownEvents = esig;
    $("feed").innerHTML = s.events.length
      ? s.events.slice().reverse().map(([t,txt,alert])=>
          `<div class="row ${alert?'alert':''}"><span class="t">${esc(t)}</span>`+
          `<span class="txt">${alert?'⚠ ':''}${esc(txt)}</span></div>`).join("")
      : `<div class="empty">no events yet</div>`;
  }
}
setInterval(poll, 200);
poll();
</script>
</body>
</html>
